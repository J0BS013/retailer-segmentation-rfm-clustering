services:

  pipeline:
    build: .
    volumes:
      - ./data:/app/data          # mounts your local data/ into the container
      - ./outputs:/app/outputs    # results written here are visible on your machine
    command: python src/run_pipeline.py

  notebook:
    build: .
    ports:
      - "8888:8888"
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./notebooks:/app/notebooks
    command: >
      jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
      --NotebookApp.token=''
