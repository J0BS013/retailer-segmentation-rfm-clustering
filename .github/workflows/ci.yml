name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create synthetic dataset for validation
        run: |
          python -c "
          import pandas as pd, os
          os.makedirs('data/raw', exist_ok=True)
          df = pd.DataFrame({
              'Invoice':     ['536365', '536366', '536367'],
              'StockCode':   ['85123A', '85124A', '85125A'],
              'Description': ['WHITE HANGING HEART', 'CREAM CUPID HEARTS', 'PINK FLORA'],
              'Quantity':    [6, 8, 6],
              'InvoiceDate': pd.to_datetime(['2009-12-01 08:26', '2009-12-01 08:28', '2009-12-01 08:34']),
              'Price':       [2.55, 3.39, 2.75],
              'Customer ID': ['17850', '13047', '12583'],
              'Country':     ['United Kingdom', 'United Kingdom', 'France'],
          })
          with pd.ExcelWriter('data/raw/online_retail_II.xlsx', engine='openpyxl') as w:
              df.to_excel(w, sheet_name='Year 2009-2010', index=False)
          "

      - name: Run extract (Pandera validation)
        run: python src/extract.py

      - name: Run tests
        run: python -m pytest tests/ -v
